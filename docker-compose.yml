services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/data"]
  api:
    build: .
    command: ["node", "dist/server.js"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      SUPPLIER_BASE_URL: http://localhost:3000
      SUPPLIER_TIMEOUT_MS: 3000
      CACHE_TTL_SECONDS: 300
      DEGRADED_CACHE_TTL_SECONDS: 60
      LOG_LEVEL: info
    depends_on:
      redis: {condition: service_healthy}
      temporal: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: .
    command: ["node", "dist/temporal/worker.js"]
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      SUPPLIER_BASE_URL: http://api:3000
      SUPPLIER_TIMEOUT_MS: 3000
      CACHE_TTL_SECONDS: 300
      DEGRADED_CACHE_TTL_SECONDS: 60
      LOG_LEVEL: info
    depends_on:
      redis: {condition: service_healthy}
      temporal: {condition: service_started}
      api: {condition: service_started}
volumes:
  temporal-data:
